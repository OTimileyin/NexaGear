<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Shape and shading only; rendered as a CSS mask so it follows the theme. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#000" stop-opacity=".55"/>
      <stop offset=".28" stop-color="#000" stop-opacity=".95"/>
      <stop offset=".72" stop-color="#000" stop-opacity=".72"/>
      <stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".7"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="prong" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".8"/>
      <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </linearGradient>
  </defs>

  <!-- plug prongs behind the body -->
  <rect x="168" y="52" width="12" height="52" rx="5" fill="url(#prong)"/>
  <rect x="220" y="52" width="12" height="52" rx="5" fill="url(#prong)"/>

  <!-- body: rounded brick with a chamfered corner -->
  <path d="M132 100h136a20 20 0 0 1 20 20v112a20 20 0 0 1-20 20H132a20 20 0 0 1-20-20V120a20 20 0 0 1 20-20z" fill="url(#body)"/>

  <!-- port face, recessed -->
  <rect x="132" y="196" width="136" height="36" rx="10" fill="#000" fill-opacity=".3"/>
  <rect x="140" y="202" width="52" height="11" rx="5.5" fill="#000" fill-opacity=".95"/>
  <rect x="204" y="202" width="52" height="11" rx="5.5" fill="#000" fill-opacity=".95"/>

  <!-- status pip -->
  <circle cx="200" cy="150" r="5" fill="#000" fill-opacity=".9"/>

  <!-- seam and highlight down the left edge -->
  <path d="M136 112v152" stroke="#000" stroke-opacity=".35" stroke-width="3" fill="none"/>
  <path d="M124 112v140" stroke="#000" stroke-opacity=".22" stroke-width="2" fill="none"/>

  <!-- contact shadow -->
  <ellipse cx="200" cy="262" rx="92" ry="9" fill="#000" fill-opacity=".16"/>
</svg>
