<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Shape and shading only; rendered as a CSS mask so it follows the theme. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".96"/>
      <stop offset=".55" stop-color="#000" stop-opacity=".68"/>
      <stop offset="1" stop-color="#000" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#000" stop-opacity=".28"/>
      <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </linearGradient>
  </defs>

  <!-- rounded slab -->
  <rect x="108" y="66" width="184" height="172" rx="26" fill="url(#shell)"/>

  <!-- recessed grip panel down the lower half -->
  <rect x="130" y="150" width="140" height="70" rx="14" fill="#000" fill-opacity=".22"/>
  <rect x="130" y="150" width="140" height="70" rx="14" fill="url(#grip)"/>

  <!-- charge-level pips, one lit -->
  <rect x="152" y="172" width="18" height="34" rx="9" fill="#000" fill-opacity=".9"/>
  <rect x="180" y="172" width="18" height="34" rx="9" fill="#000" fill-opacity=".9"/>
  <rect x="208" y="172" width="18" height="34" rx="9" fill="#000" fill-opacity=".9"/>
  <rect x="236" y="172" width="18" height="34" rx="9" fill="#000" fill-opacity=".28"/>

  <!-- USB-A and USB-C ports on the top edge -->
  <rect x="146" y="94" width="50" height="14" rx="3" fill="#000" fill-opacity=".95"/>
  <rect x="206" y="97" width="34" height="11" rx="5.5" fill="#000" fill-opacity=".95"/>

  <!-- button and edge highlight -->
  <circle cx="266" cy="102" r="8" fill="#000" fill-opacity=".55"/>
  <path d="M118 84v136" stroke="#000" stroke-opacity=".28" stroke-width="3" fill="none"/>

  <!-- contact shadow -->
  <ellipse cx="200" cy="248" rx="96" ry="10" fill="#000" fill-opacity=".16"/>
</svg>
