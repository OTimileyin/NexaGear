<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Shape and shading only; rendered as a CSS mask so it follows the theme. -->
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#000" stop-opacity=".62"/>
      <stop offset="1" stop-color="#000" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".95"/>
      <stop offset="1" stop-color="#000" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#000" stop-opacity=".95"/>
      <stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </linearGradient>
  </defs>

  <!-- board with a notched corner so the outline is not just a rectangle -->
  <path d="M70 84h262v146H70z" fill="url(#pcb)"/>
  <path d="M70 84h34l-12 12 12 12H70z" fill="#000" fill-opacity=".28"/>

  <!-- header pin strips along both long edges -->
  <g fill="#000" fill-opacity=".92">
    <rect x="86" y="72" width="12" height="16" rx="2"/><rect x="112" y="72" width="12" height="16" rx="2"/>
    <rect x="138" y="72" width="12" height="16" rx="2"/><rect x="164" y="72" width="12" height="16" rx="2"/>
    <rect x="190" y="72" width="12" height="16" rx="2"/><rect x="216" y="72" width="12" height="16" rx="2"/>
    <rect x="242" y="72" width="12" height="16" rx="2"/><rect x="268" y="72" width="12" height="16" rx="2"/>
    <rect x="86" y="226" width="12" height="16" rx="2"/><rect x="112" y="226" width="12" height="16" rx="2"/>
    <rect x="138" y="226" width="12" height="16" rx="2"/><rect x="164" y="226" width="12" height="16" rx="2"/>
  </g>

  <!-- main microcontroller, the darkest element on the board -->
  <rect x="146" y="128" width="72" height="58" rx="4" fill="url(#chip)"/>
  <g stroke="#000" stroke-opacity=".55" stroke-width="2">
    <path d="M138 140h8M138 152h8M138 164h8M218 140h8M218 152h8M218 164h8"/>
  </g>

  <!-- USB-C connector and barrel jack on the left edge -->
  <rect x="48" y="130" width="24" height="34" rx="5" fill="url(#metal)"/>
  <rect x="54" y="141" width="14" height="12" rx="5" fill="#000" fill-opacity=".95"/>
  <circle cx="60" cy="192" r="11" fill="url(#metal)"/>
  <circle cx="60" cy="192" r="5" fill="#000" fill-opacity=".95"/>

  <!-- headers and passives, abstracted so they read as components -->
  <g fill="#000" fill-opacity=".55">
    <rect x="96" y="126" width="30" height="18" rx="3"/>
    <rect x="248" y="126" width="30" height="18" rx="3"/>
    <rect x="96" y="176" width="26" height="14" rx="3"/>
    <rect x="250" y="180" width="26" height="14" rx="3"/>
  </g>
  <g fill="#000" fill-opacity=".4">
    <circle cx="140" cy="112" r="6"/><circle cx="164" cy="112" r="6"/>
    <circle cx="240" cy="200" r="6"/><circle cx="264" cy="200" r="6"/>
  </g>

  <!-- silkscreen rule and mounting holes -->
  <path d="M86 210h228" stroke="#000" stroke-opacity=".3" stroke-width="2"/>
  <circle cx="86" cy="98" r="6" fill="#000" fill-opacity=".35"/>
  <circle cx="316" cy="98" r="6" fill="#000" fill-opacity=".35"/>
  <circle cx="86" cy="216" r="6" fill="#000" fill-opacity=".35"/>
  <circle cx="316" cy="216" r="6" fill="#000" fill-opacity=".35"/>

  <!-- contact shadow -->
  <ellipse cx="200" cy="252" rx="136" ry="9" fill="#000" fill-opacity=".15"/>
</svg>
