<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!--
    Shape and shading only — no colour of its own. Rendered as a CSS mask, the
    varied opacities below become depth: the same file reads as dark ink on a
    light surface and light ink on a dark one.
  -->
  <defs>
    <linearGradient id="caseTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".92"/>
      <stop offset="1" stop-color="#000" stop-opacity=".62"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".58"/>
      <stop offset="1" stop-color="#000" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="capTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".98"/>
      <stop offset="1" stop-color="#000" stop-opacity=".78"/>
    </linearGradient>
  </defs>

  <!-- chassis: front wall below the deck, then the deck itself -->
  <path d="M58 108h284l-10 22H68z" fill="url(#side)"/>
  <rect x="58" y="88" width="284" height="22" rx="6" fill="url(#caseTop)"/>

  <!-- key rows, each key a small rounded cap -->
  <g fill="url(#capTop)">
    <rect x="70" y="94" width="26" height="14" rx="3"/>
    <rect x="100" y="94" width="26" height="14" rx="3"/>
    <rect x="130" y="94" width="26" height="14" rx="3"/>
    <rect x="160" y="94" width="26" height="14" rx="3"/>
    <rect x="190" y="94" width="26" height="14" rx="3"/>
    <rect x="220" y="94" width="26" height="14" rx="3"/>
    <rect x="250" y="94" width="26" height="14" rx="3"/>
    <rect x="280" y="94" width="26" height="14" rx="3"/>
    <rect x="310" y="94" width="20" height="14" rx="3"/>
  </g>
  <g fill="#000" fill-opacity=".88">
    <rect x="70" y="112" width="30" height="13" rx="3"/>
    <rect x="104" y="112" width="30" height="13" rx="3"/>
    <rect x="138" y="112" width="30" height="13" rx="3"/>
    <rect x="172" y="112" width="30" height="13" rx="3"/>
    <rect x="206" y="112" width="30" height="13" rx="3"/>
    <rect x="240" y="112" width="30" height="13" rx="3"/>
    <rect x="274" y="112" width="30" height="13" rx="3"/>
    <rect x="308" y="112" width="22" height="13" rx="3"/>
  </g>

  <!-- spacebar row, lifted keys reading brighter than the deck -->
  <g fill="#000" fill-opacity=".95">
    <rect x="70" y="129" width="24" height="12" rx="3"/>
    <rect x="98" y="129" width="24" height="12" rx="3"/>
    <rect x="126" y="129" width="24" height="12" rx="3"/>
    <rect x="154" y="129" width="90" height="12" rx="3"/>
    <rect x="248" y="129" width="24" height="12" rx="3"/>
    <rect x="276" y="129" width="24" height="12" rx="3"/>
    <rect x="304" y="129" width="26" height="12" rx="3"/>
  </g>

  <!-- USB-C port, recessed -->
  <rect x="326" y="104" width="14" height="7" rx="3.5" fill="#000" fill-opacity=".34"/>

  <!-- contact shadow so the deck sits above the surface rather than on it -->
  <ellipse cx="200" cy="136" rx="150" ry="9" fill="#000" fill-opacity=".13"/>
</svg>
