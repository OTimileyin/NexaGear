<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Shape and shading only; rendered as a CSS mask so it follows the theme. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#000" stop-opacity=".66"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#000" stop-opacity=".55"/>
      <stop offset="1" stop-color="#000" stop-opacity=".75"/>
    </linearGradient>
  </defs>

  <!-- slim slab seen at a slight angle -->
  <path d="M74 128h252a10 10 0 0 1 10 10v72a10 10 0 0 1-10 10H74a10 10 0 0 1-10-10v-72a10 10 0 0 1 10-10z" fill="url(#body)"/>
  <path d="M74 128h252a10 10 0 0 1 10 10v16H64v-16a10 10 0 0 1 10-10z" fill="url(#top)"/>

  <!-- port bay, recessed into the top face -->
  <rect x="86" y="164" width="228" height="40" rx="8" fill="#000" fill-opacity=".28"/>

  <!-- two USB-A, an HDMI and two USB-C, drawn to scale -->
  <rect x="98" y="172" width="44" height="24" rx="3" fill="#000" fill-opacity=".96"/>
  <rect x="150" y="172" width="44" height="24" rx="3" fill="#000" fill-opacity=".96"/>
  <rect x="202" y="172" width="50" height="24" rx="3" fill="#000" fill-opacity=".96"/>
  <rect x="260" y="178" width="26" height="12" rx="6" fill="#000" fill-opacity=".96"/>
  <rect x="294" y="178" width="20" height="12" rx="6" fill="#000" fill-opacity=".96"/>

  <!-- etched spec text block, kept abstract so it reads as labelling not words -->
  <g fill="#000" fill-opacity=".3">
    <rect x="98" y="136" width="54" height="5" rx="2.5"/>
    <rect x="98" y="146" width="34" height="5" rx="2.5"/>
  </g>

  <!-- cable exiting right -->
  <path d="M330 176c26 0 34 12 34 26" stroke="#000" stroke-opacity=".8" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- contact shadow -->
  <ellipse cx="200" cy="232" rx="132" ry="9" fill="#000" fill-opacity=".15"/>
</svg>
