<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Shape and shading only; rendered as a CSS mask so it follows the theme. -->
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#000" stop-opacity=".64"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="module" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".9"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <!-- breadboard body with its channel groove down the middle -->
  <path d="M74 118h252l8 10v70l-8 10H74l-8-10v-70z" fill="url(#board)"/>
  <rect x="66" y="150" width="268" height="26" fill="#000" fill-opacity=".3"/>

  <!-- hole grid either side of the channel -->
  <g fill="#000" fill-opacity=".8">
    <circle cx="90" cy="136" r="3.5"/><circle cx="112" cy="136" r="3.5"/><circle cx="134" cy="136" r="3.5"/>
    <circle cx="266" cy="136" r="3.5"/><circle cx="288" cy="136" r="3.5"/><circle cx="310" cy="136" r="3.5"/>
    <circle cx="90" cy="190" r="3.5"/><circle cx="112" cy="190" r="3.5"/><circle cx="134" cy="190" r="3.5"/>
    <circle cx="266" cy="190" r="3.5"/><circle cx="288" cy="190" r="3.5"/><circle cx="310" cy="190" r="3.5"/>
  </g>

  <!-- sensor modules plugged into the board -->
  <rect x="96" y="96" width="62" height="34" rx="5" fill="url(#module)"/>
  <rect x="176" y="92" width="48" height="38" rx="5" fill="url(#module)"/>
  <rect x="242" y="98" width="56" height="32" rx="5" fill="url(#module)"/>

  <!-- pin legs from each module into the grid -->
  <g fill="#000" fill-opacity=".9">
    <rect x="106" y="130" width="5" height="12" rx="2"/><rect x="122" y="130" width="5" height="12" rx="2"/>
    <rect x="186" y="130" width="5" height="12" rx="2"/><rect x="204" y="130" width="5" height="12" rx="2"/>
    <rect x="256" y="130" width="5" height="12" rx="2"/><rect x="274" y="130" width="5" height="12" rx="2"/>
  </g>

  <!-- jumper leads arcing between modules -->
  <path d="M158 104c14-22 40-22 54-6" stroke="#000" stroke-opacity=".85" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M224 108c14-24 42-26 56-14" stroke="#000" stroke-opacity=".6" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- rotary trimmer and a header strip on the far board -->
  <circle cx="200" cy="186" r="12" fill="#000" fill-opacity=".9"/>
  <g fill="#000" fill-opacity=".7">
    <rect x="150" y="204" width="10" height="12" rx="2"/><rect x="168" y="204" width="10" height="12" rx="2"/>
    <rect x="186" y="204" width="10" height="12" rx="2"/><rect x="204" y="204" width="10" height="12" rx="2"/>
  </g>

  <!-- contact shadow -->
  <ellipse cx="200" cy="232" rx="128" ry="9" fill="#000" fill-opacity=".15"/>
</svg>
