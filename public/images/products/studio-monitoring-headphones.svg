<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Shape and shading only; rendered as a CSS mask so it follows the theme. -->
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".95"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="cup" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#000" stop-opacity=".66"/>
      <stop offset="1" stop-color="#000" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="cushion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".45"/>
      <stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".35" cy=".25" r=".55">
      <stop offset="0" stop-color="#000" stop-opacity=".42"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- headband arc -->
  <path d="M118 176v-22a82 82 0 0 1 164 0v22" fill="none" stroke="url(#band)" stroke-width="20" stroke-linecap="round"/>
  <path d="M136 160a66 66 0 0 1 128 0" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"/>

  <!-- slider arms into each cup -->
  <rect x="110" y="168" width="16" height="34" rx="7" fill="#000" fill-opacity=".8"/>
  <rect x="274" y="168" width="16" height="34" rx="7" fill="#000" fill-opacity=".8"/>

  <!-- left ear cup -->
  <rect x="86" y="192" width="72" height="86" rx="30" fill="url(#cup)"/>
  <rect x="86" y="192" width="72" height="86" rx="30" fill="url(#sheen)"/>
  <ellipse cx="122" cy="235" rx="26" ry="33" fill="url(#cushion)"/>
  <ellipse cx="122" cy="235" rx="13" ry="18" fill="#000" fill-opacity=".85"/>

  <!-- right ear cup, mirrored so the pair reads symmetric -->
  <rect x="242" y="192" width="72" height="86" rx="30" fill="url(#cup)"/>
  <rect x="242" y="192" width="72" height="86" rx="30" fill="url(#sheen)"/>
  <ellipse cx="278" cy="235" rx="26" ry="33" fill="url(#cushion)"/>
  <ellipse cx="278" cy="235" rx="13" ry="18" fill="#000" fill-opacity=".85"/>

  <!-- cable from the left cup -->
  <path d="M110 278c-4 12-16 14-16 22" stroke="#000" stroke-opacity=".7" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- contact shadow -->
  <ellipse cx="200" cy="288" rx="112" ry="8" fill="#000" fill-opacity=".15"/>
</svg>
