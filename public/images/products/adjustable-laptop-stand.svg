<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Shape and shading only; rendered as a CSS mask so it follows the theme. -->
  <defs>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#000" stop-opacity=".7"/>
      <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="strut" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".85"/>
      <stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".8"/>
      <stop offset="1" stop-color="#000" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".55"/>
      <stop offset="1" stop-color="#000" stop-opacity=".3"/>
    </linearGradient>
  </defs>

  <!-- screen, tilted back -->
  <path d="M104 74h192l10 104H94z" fill="url(#screen)"/>
  <path d="M104 74h192l3 30H101z" fill="#000" fill-opacity=".72"/>

  <!-- hinge -->
  <rect x="92" y="176" width="216" height="12" rx="6" fill="#000" fill-opacity=".8"/>

  <!-- inclined deck the laptop sits on -->
  <path d="M78 186h244l-14 18H92z" fill="url(#deck)"/>

  <!-- folding strut -->
  <path d="M186 204h28l10 62h-48z" fill="url(#strut)"/>
  <rect x="182" y="204" width="36" height="8" rx="4" fill="#000" fill-opacity=".62"/>

  <!-- base foot with a raised lip -->
  <path d="M124 262h152l14 12H110z" fill="url(#foot)"/>
  <path d="M110 274h180v8H110z" fill="#000" fill-opacity=".55"/>

  <!-- contact shadow -->
  <ellipse cx="200" cy="286" rx="118" ry="8" fill="#000" fill-opacity=".16"/>
</svg>
