<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Shape and shading only; rendered as a CSS mask so it follows the theme. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".96"/>
      <stop offset=".5" stop-color="#000" stop-opacity=".7"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="leftBtn" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#000" stop-opacity=".85"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="rightBtn" x1="1" y1="0" x2="0" y2="0.4">
      <stop offset="0" stop-color="#000" stop-opacity=".85"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".35" cy=".22" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".5"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- body: narrow at the front, flaring at the palm -->
  <path d="M200 48c46 0 78 34 78 92v46c0 42-34 66-78 66s-78-24-78-66v-46c0-58 32-92 78-92z" fill="url(#shell)"/>
  <path d="M200 48c46 0 78 34 78 92v46c0 42-34 66-78 66s-78-24-78-66v-46c0-58 32-92 78-92z" fill="url(#sheen)"/>

  <!-- button split and click plates -->
  <path d="M200 50v88" stroke="#000" stroke-opacity=".9" stroke-width="2.5"/>
  <path d="M194 50h-70v74h76z" fill="url(#leftBtn)"/>
  <path d="M206 50h70v74h-76z" fill="url(#rightBtn)"/>

  <!-- scroll wheel, recessed between the plates -->
  <rect x="192" y="72" width="16" height="34" rx="8" fill="#000" fill-opacity=".98"/>
  <rect x="194" y="76" width="12" height="26" rx="6" fill="#000" fill-opacity=".55"/>

  <!-- side thumb rest -->
  <path d="M122 150c-6 22-6 44 0 64 10 10 22 14 30 12l6-70z" fill="#000" fill-opacity=".5"/>

  <!-- sensor + base seam -->
  <path d="M126 236c22 12 48 16 74 16s52-4 74-16" stroke="#000" stroke-opacity=".42" stroke-width="2" fill="none"/>

  <!-- contact shadow -->
  <ellipse cx="200" cy="268" rx="86" ry="10" fill="#000" fill-opacity=".16"/>
</svg>
