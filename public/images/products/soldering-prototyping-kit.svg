<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Shape and shading only; rendered as a CSS mask so it follows the theme. -->
  <defs>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#000" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#000" stop-opacity=".95"/>
      <stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".9"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="coil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#000" stop-opacity=".62"/>
      <stop offset="1" stop-color="#000" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".82"/>
      <stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </linearGradient>
  </defs>

  <!-- iron stand with its coiled holder -->
  <path d="M78 232h244l10 14H68z" fill="url(#base)"/>
  <path d="M108 176h84l-8 56h-68z" fill="url(#shaft)"/>
  <path d="M108 176h84l-4 14h-76z" fill="#000" fill-opacity=".4"/>
  <g fill="#000" fill-opacity=".75">
    <ellipse cx="150" cy="188" rx="34" ry="9"/>
    <ellipse cx="150" cy="202" rx="34" ry="9"/>
    <ellipse cx="150" cy="216" rx="34" ry="9"/>
  </g>

  <!-- soldering iron resting in the stand, barrel to the right -->
  <path d="M186 186h122l14 14-14 14H186l-10-14z" fill="url(#handle)"/>
  <path d="M186 200h-46l-14 8 10 12h50z" fill="url(#shaft)"/>
  <path d="M126 210l-30 12 6 8 30-14z" fill="#000" fill-opacity=".9"/>
  <path d="M212 190h84v6h-84z" fill="#000" fill-opacity=".3"/>

  <!-- solder spool, wire wound into a disc -->
  <circle cx="312" cy="150" r="44" fill="url(#coil)"/>
  <circle cx="312" cy="150" r="30" fill="#000" fill-opacity=".35"/>
  <circle cx="312" cy="150" r="14" fill="#000" fill-opacity=".95"/>
  <path d="M272 150c14 12 24 20 34 34" stroke="#000" stroke-opacity=".55" stroke-width="4" fill="none"/>

  <!-- loose solder tip on the base -->
  <rect x="120" y="238" width="70" height="7" rx="3.5" fill="#000" fill-opacity=".8"/>

  <!-- contact shadow -->
  <ellipse cx="200" cy="256" rx="136" ry="9" fill="#000" fill-opacity=".15"/>
</svg>
